<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PSulit Audit Report</title><style>:root{--g:#0c5b42;--bg:#f3f6f4;--blue:#2396eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17211d}.wrap{max-width:660px;margin:auto;padding:10px 9px 40px}.hero{background:linear-gradient(135deg,#0c503b,#08704c);color:#fff;border-radius:18px;padding:18px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;font-size:13px}.card{background:#fff;border-radius:16px;padding:14px;margin-top:11px;box-shadow:0 6px 18px rgba(26,55,44,.08)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}select,input{width:100%;border:1px solid #cad8d1;border-radius:11px;padding:12px 10px;font-size:15px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btn{border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#e9f3ee;color:var(--g)}.telegram{width:100%;margin-top:9px;background:var(--blue);color:#fff}.disabled{opacity:.45;pointer-events:none}.status{margin-top:10px;padding:10px 11px;border-radius:10px;background:#eef8f3;color:#2e624e;font-size:12px}.status.err{background:#fff0ef;color:#a5332b}.hidden{display:none}.previewHead{display:flex;justify-content:space-between;align-items:center}.previewHead h2{font-size:18px;margin:0}.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#e9f6ef;color:var(--g);font-weight:800}.imgWrap{margin-top:10px;background:#151a18;border-radius:14px;padding:6px}.imgWrap img{width:100%;display:block;border-radius:8px;background:#fff}.note{font-size:11px;color:#68766f;line-height:1.35;margin-top:8px}@media(max-width:470px){.grid,.actions{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head><body><div class="wrap"><div class="hero"><h1>PSulit Audit Report</h1><p>Generate one compact audit image, review it, then send to Telegram.</p></div><div class="card"><div class="grid"><div><label>Report Type</label><select id="type"><option value="daily">Daily Report</option><option value="monthly">Month-End Report</option></select></div><div><label>Branch</label><select id="branch"><option>Alphaland</option><option>Solaire</option></select></div><div id="dateBox"><label>Audit Date</label><input id="date" type="date" value="2026-09-30"></div><div id="monthBox" class="hidden"><label>Audit Month</label><input id="month" type="month" value="2026-09"></div></div><div class="actions"><button id="generate" class="btn primary">Generate Audit Image</button><button id="view" class="btn secondary">View Image</button></div><button id="send" class="btn telegram disabled">Send to Telegram</button><div id="status" class="status">Ready for test: Alphaland • September 30, 2026.</div><div class="note">Alphaland: Forex + Scratch + Hive. Solaire: Forex + Hive only. LottoMatik has a separate audit.</div></div><div class="card" id="previewCard"><div class="previewHead"><h2>Audit Image</h2><span id="badge" class="badge">Not generated</span></div><div id="imgWrap" class="imgWrap hidden"><img id="png" alt="Generated audit report"></div></div></div><script>
const SUPA='https://ivfpgshtknelingsvbfi.supabase.co';const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2ZnBnc2h0a25lbGluZ3N2YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODU4OTYsImV4cCI6MjEwNTI2MTg5Nn0.xxzqW81NWzw7OOwQRuOoTZQIUdLGjdrcTTzmxiWK1sY';const $=id=>document.getElementById(id),type=$('type'),branch=$('branch'),date=$('date'),month=$('month'),dateBox=$('dateBox'),monthBox=$('monthBox'),send=$('send'),status=$('status'),badge=$('badge'),png=$('png'),imgWrap=$('imgWrap'),previewCard=$('previewCard');function setStatus(m,e=false){status.textContent=m;status.classList.toggle('err',e)}function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const row=(x,y,w,l,v,opt={})=>{const fs=opt.fs||22,b=opt.bold?'700':'400',c=opt.color||'#17211d',bg=opt.bg||'white';return `<rect x="${x}" y="${y}" width="${w}" height="44" fill="${bg}"/><line x1="${x}" x2="${x+w}" y1="${y+44}" y2="${y+44}" stroke="#e2e9e5"/><text x="${x+14}" y="${y+29}" font-family="Arial" font-size="${fs}" font-weight="${b}" fill="#17211d">${esc(l)}</text><text x="${x+w-14}" y="${y+29}" text-anchor="end" font-family="Arial" font-size="${fs}" font-weight="${opt.bold?'700':'600'}" fill="${c}">${esc(v)}</text>`};
const sec=(x,y,w,t,color='#0c5b42',bg='#e7f5ef')=>`<rect x="${x}" y="${y}" width="${w}" height="48" rx="10" fill="${bg}"/><text x="${x+14}" y="${y+32}" font-family="Arial" font-size="24" font-weight="800" fill="${color}">${esc(t)}</text>`;
function shell(branchName,subtitle,statusText){const W=980,M=18;return {W,M,s:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="1430"><rect width="100%" height="100%" rx="22" fill="white"/><rect x="${M}" y="${M}" width="${W-M*2}" height="94" rx="18" fill="#0c6a4e"/><text x="${W/2}" y="58" text-anchor="middle" font-family="Arial" font-size="43" font-weight="800" fill="white">PSULIT ${branchName}</text><text x="${W/2}" y="89" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">${subtitle}</text><rect x="${M}" y="120" width="${W-M*2}" height="58" rx="14" fill="#e6f7ef"/><text x="${W/2}" y="157" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#0c5b42">${statusText}</text>`}}
function buildAlphaland(){const {W,M,s:base}=shell('ALPHALAND','COMBINED DAILY AUDIT • SEPTEMBER 30, 2026','✓ STATUS: FOREX + HIVE RECONCILED • SCRATCH ₱92 OVER');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;s+=sec(lx,ly,C,'FOREX — PHP CASH RECONCILIATION');ly+=48;[['Opening PHP','₱175,413.98'],['+ SELL cash-in','₱122,095.70'],['− BUY cash-out','₱115,944.35'],['− Forex-funded expense','₱11,365.98']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1]);ly+=44});s+=row(lx,ly,C,'Expected closing PHP','₱170,199.35',{bold:true,bg:'#eaf8f1'});ly+=44;s+=row(lx,ly,C,'Actual closing PHP','₱170,199.35',{bold:true});ly+=44;s+=row(lx,ly,C,'PHP variance','₱0.00',{color:'#11833f',bold:true});ly+=44;s+=row(lx,ly,C,'Expense detail','Bridge Access ₱11,365.98',{fs:18});ly+=58;s+=sec(lx,ly,C,'SCRATCH IT','#8b6200','#fff1bd');ly+=48;[['Opening cash','₱17,403.00'],['+ Sales','₱1,280.00'],['− Payouts','₱1,510.00']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1]);ly+=44});s+=row(lx,ly,C,'Expected closing','₱17,173.00',{bold:true,bg:'#fff7d9'});ly+=44;s+=row(lx,ly,C,'Actual closing','₱17,265.00',{bold:true});ly+=44;s+=row(lx,ly,C,'Variance','OVER ₱92.00',{color:'#c98200',bold:true});ly+=44;s+=row(lx,ly,C,'Cards sold','64');ly+=44;s+=row(lx,ly,C,'Supplier cost','₱1,152.00');ly+=44;s+=row(lx,ly,C,'SCRATCH GROSS PROFIT','₱128.00',{color:'#11833f',bold:true,bg:'#eaf8f1'});ly+=44;s+=sec(rx,ry,C,'FOREX — INVENTORY CHECK');ry+=48;[['USD','129 + 1,865 − 1,694 = 300'],['JPY','40,000 − 40,000 = 0'],['AUD','300 • matched'],['EUR','300 • matched'],['MYR','77 • matched'],['TWD','700 • matched']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{fs:21});ry+=44});ry+=14;s+=sec(rx,ry,C,'FOREX — PROFIT / INCOME');ry+=48;s+=row(rx,ry,C,'USD gross profit','₱673.22',{bold:true});ry+=44;s+=row(rx,ry,C,'JPY gross profit','₱736.00',{bold:true});ry+=44;s+=row(rx,ry,C,'FOREX GROSS PROFIT','₱1,409.22',{color:'#11833f',bold:true,bg:'#eaf8f1'});ry+=44;s+=row(rx,ry,C,'Less forex expense','₱11,365.98',{fs:20});ry+=44;s+=row(rx,ry,C,'Net Forex after expense','−₱9,956.76',{color:'#d92d20',bold:true,fs:20,bg:'#fff0ef'});ry+=58;s+=sec(rx,ry,C,'HIVE','#fff','#6754c5');ry+=48;s+=row(rx,ry,C,'Opening balance','₱50,074.37',{bold:true});ry+=44;s+=row(rx,ry,C,'Hive in / out','₱0.00 / ₱0.00');ry+=44;s+=row(rx,ry,C,'Forex borrow / return','₱0.00 / ₱0.00',{fs:19});ry+=44;s+=row(rx,ry,C,'Expected closing','₱50,074.37',{bold:true,bg:'#eef0ff'});ry+=44;s+=row(rx,ry,C,'Actual closing','₱50,074.37',{bold:true});ry+=44;s+=row(rx,ry,C,'Variance','₱0.00',{color:'#11833f',bold:true});ry+=44;const sy=Math.max(ly,ry)+24;s+=`<rect x="${M}" y="${sy}" width="${W-M*2}" height="52" rx="10" fill="#0c6a4e"/><text x="${M+16}" y="${sy+35}" font-family="Arial" font-size="27" font-weight="800" fill="white">PROFIT SUMMARY</text>`;let py=sy+52;s+=row(M,py,W-M*2,'Forex gross profit','₱1,409.22',{bold:true,fs:24});py+=44;s+=row(M,py,W-M*2,'Scratch gross profit','₱128.00',{bold:true,fs:24});py+=44;s+=row(M,py,W-M*2,'Combined gross profit','₱1,537.22',{bold:true,fs:24,bg:'#eaf8f1'});py+=44;s+=row(M,py,W-M*2,'Less Forex-funded expense','₱11,365.98',{fs:24});py+=44;s+=row(M,py,W-M*2,'NET AFTER EXPENSE','−₱9,828.76',{bold:true,fs:28,color:'#e11d1d',bg:'#eaf8f1'});py+=60;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="18" font-weight="700" fill="#33443d">Audit result: Forex and Hive reconciled. Scratch is ₱92 OVER, not short.</text></svg>`;return s.replace('height="1430"',`height="${py+28}"`)}
function buildSolaire(){const {W,M,s:base}=shell('SOLAIRE','DAILY AUDIT • SEPTEMBER 30, 2026','⚠ STATUS: FOREX SHORT ₱3,909.80 • HIVE NO SEPT 30 MOVEMENT');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;s+=sec(lx,ly,C,'FOREX — PHP CASH RECONCILIATION');ly+=48;s+=row(lx,ly,C,'Opening PHP (derived)','₱305,503.49',{bold:true,fs:20});ly+=44;s+=row(lx,ly,C,'+ SELL cash-in','₱1,148,084.00');ly+=44;s+=row(lx,ly,C,'− BUY cash-out','₱859,477.10');ly+=44;s+=row(lx,ly,C,'− Fare expense','₱118.00');ly+=44;s+=row(lx,ly,C,'− Barang.ai receivable','₱12,000.00',{fs:19});ly+=44;s+=row(lx,ly,C,'Expected closing PHP','₱581,992.39',{bold:true,bg:'#eaf8f1'});ly+=44;s+=row(lx,ly,C,'Actual closing PHP','₱578,082.59',{bold:true});ly+=44;s+=row(lx,ly,C,'PHP variance','SHORT ₱3,909.80',{color:'#d92d20',bold:true});ly+=58;s+=sec(lx,ly,C,'HIVE','#fff','#6754c5');ly+=48;s+=row(lx,ly,C,'Current cash balance','₱96,274.00',{bold:true});ly+=44;s+=row(lx,ly,C,'Sept 30 Hive in / out','₱0.00 / ₱0.00',{fs:20});ly+=44;s+=row(lx,ly,C,'Forex borrow / return','₱0.00 / ₱0.00',{fs:19});ly+=44;s+=row(lx,ly,C,'Sept 30 movement','None logged',{bold:true});ly+=44;s+=sec(rx,ry,C,'FOREX — INVENTORY CHECK');ry+=48;[['USD','13,515 + 13,790 − 17,800 = 9,505'],['JPY','100,000 − 10,000 = 90,000'],['EUR','520 − 420 = 100'],['TWD','3,300 + 1,000 = 4,300'],['THB','620 • unchanged'],['CHF','20 • unchanged']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{fs:19});ry+=44});ry+=14;s+=sec(rx,ry,C,'FOREX — PROFIT / INCOME');ry+=48;s+=row(rx,ry,C,'USD gross profit','₱6,509.05',{bold:true});ry+=44;s+=row(rx,ry,C,'EUR gross profit','₱1,267.60',{bold:true});ry+=44;s+=row(rx,ry,C,'JPY gross profit','₱140.00',{bold:true});ry+=44;s+=row(rx,ry,C,'FOREX GROSS PROFIT','₱7,916.65',{color:'#11833f',bold:true,bg:'#eaf8f1'});ry+=44;s+=row(rx,ry,C,'Less operating expense','₱118.00',{fs:20});ry+=44;s+=row(rx,ry,C,'NET FOREX PROFIT','₱7,798.65',{color:'#11833f',bold:true,bg:'#eaf8f1'});ry+=58;s+=sec(rx,ry,C,'CASH MOVEMENT NOTE','#8b6200','#fff1bd');ry+=48;s+=row(rx,ry,C,'Barang.ai receivable','₱12,000.00',{bold:true});ry+=44;s+=row(rx,ry,C,'Profit treatment','Excluded from expense',{fs:18});ry+=44;const sy=Math.max(ly,ry)+24;s+=`<rect x="${M}" y="${sy}" width="${W-M*2}" height="52" rx="10" fill="#0c6a4e"/><text x="${M+16}" y="${sy+35}" font-family="Arial" font-size="27" font-weight="800" fill="white">PROFIT SUMMARY</text>`;let py=sy+52;s+=row(M,py,W-M*2,'Forex gross profit','₱7,916.65',{bold:true,fs:24});py+=44;s+=row(M,py,W-M*2,'Operating expense','₱118.00',{fs:24});py+=44;s+=row(M,py,W-M*2,'NET FOREX PROFIT','₱7,798.65',{bold:true,fs:28,color:'#11833f',bg:'#eaf8f1'});py+=44;s+=row(M,py,W-M*2,'Forex cash variance','SHORT ₱3,909.80',{bold:true,fs:27,color:'#d92d20',bg:'#fff0ef'});py+=60;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="18" font-weight="700" fill="#33443d">Audit result: FX quantities reconcile. Forex PHP is SHORT ₱3,909.80. Hive has no Sept 30 movement logged.</text></svg>`;return s.replace('height="1430"',`height="${py+28}"`)}
async function svgToPng(svg){const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),im=new Image();return await new Promise((ok,no)=>{im.onload=()=>{const c=document.createElement('canvas');c.width=1960;c.height=Math.round(im.height*2);const ctx=c.getContext('2d');ctx.scale(2,2);ctx.drawImage(im,0,0);URL.revokeObjectURL(url);ok(c.toDataURL('image/png'))};im.onerror=e=>{URL.revokeObjectURL(url);no(e)};im.src=url})}function resetGenerated(){imgWrap.classList.add('hidden');png.removeAttribute('src');badge.textContent='Not generated';send.classList.add('disabled');send.textContent='Send to Telegram'}type.onchange=()=>{dateBox.classList.toggle('hidden',type.value==='monthly');monthBox.classList.toggle('hidden',type.value!=='monthly');resetGenerated();setStatus(type.value==='monthly'?'Month-End mode selected.':'Daily mode selected.')};branch.onchange=()=>{resetGenerated();setStatus(branch.value==='Solaire'?'Solaire connected: Forex + Hive only.':'Alphaland connected: Forex + Scratch + Hive. LottoMatik is separate.')};date.onchange=resetGenerated;month.onchange=resetGenerated;$('generate').onclick=async()=>{resetGenerated();if(type.value==='daily'&&date.value==='2026-09-30'&&(branch.value==='Alphaland'||branch.value==='Solaire')){try{setStatus(`Generating compact verified ${branch.value} audit image…`);png.src=await svgToPng(branch.value==='Solaire'?buildSolaire():buildAlphaland());imgWrap.classList.remove('hidden');badge.textContent='PNG Ready';send.classList.remove('disabled');setStatus(`PNG Ready — September 30 ${branch.value} audit generated.`)}catch(e){setStatus('Could not generate image. Please refresh and try again.',true)}}else if(type.value==='monthly'){setStatus('Month-End layout is ready; live monthly aggregation is not connected yet.',true)}else{setStatus('No verified data connected for this selection yet.',true)}};$('view').onclick=()=>previewCard.scrollIntoView({behavior:'smooth'});send.onclick=async()=>{if(send.classList.contains('disabled'))return;send.classList.add('disabled');send.textContent='Sending…';setStatus(`Sending verified audit image to ${branch.value} Telegram…`);try{const r=await fetch(`${SUPA}/functions/v1/psulit-audit-app-send-test`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON}`,'apikey':ANON},body:JSON.stringify({type:type.value,branch:branch.value,date:date.value})});const data=await r.json().catch(()=>({}));if(!r.ok||data.ok!==true)throw new Error(data.error||`HTTP ${r.status}`);badge.textContent='Sent';setStatus(`Sent to Telegram successfully${data.messageId?' • Message '+data.messageId:''}.`);send.textContent='Sent to Telegram'}catch(e){setStatus('Telegram send failed: '+(e?.message||e),true);send.textContent='Send to Telegram';send.classList.remove('disabled')}};</script></body></html>
