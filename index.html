<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSulit Audit Report</title>
<style>
:root{--g:#0c5b42;--bg:#f3f6f4;--blue:#2396eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17211d}
.wrap{max-width:660px;margin:auto;padding:10px 9px 40px}
.hero{background:linear-gradient(135deg,#0c503b,#08704c);color:#fff;border-radius:18px;padding:18px}
.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;font-size:13px}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:11px;box-shadow:0 6px 18px rgba(26,55,44,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}
select,input{width:100%;border:1px solid #cad8d1;border-radius:11px;padding:12px 10px;font-size:15px;background:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.btn{border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:850;cursor:pointer}
.primary{background:var(--g);color:#fff}.secondary{background:#e9f3ee;color:var(--g)}
.telegram{width:100%;margin-top:9px;background:var(--blue);color:#fff}
.disabled{opacity:.45;pointer-events:none}
.status{margin-top:10px;padding:10px 11px;border-radius:10px;background:#eef8f3;color:#2e624e;font-size:12px}
.status.err{background:#fff0ef;color:#a5332b}
.hidden{display:none}.previewHead{display:flex;justify-content:space-between;align-items:center}
.previewHead h2{font-size:18px;margin:0}.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#e9f6ef;color:var(--g);font-weight:800}
.imgWrap{margin-top:10px;background:#151a18;border-radius:14px;padding:6px}.imgWrap img{width:100%;display:block;border-radius:8px;background:#fff}
.note{font-size:11px;color:#68766f;line-height:1.35;margin-top:8px}
@media(max-width:470px){.grid,.actions{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>PSulit Audit Report</h1><p>Generate one compact audit image, review it, then send to Telegram.</p></div>
  <div class="card">
    <div class="grid">
      <div><label>Report Type</label><select id="type"><option value="daily">Daily Report</option><option value="monthly">Month-End Report</option></select></div>
      <div><label>Branch</label><select id="branch"><option>Alphaland</option><option>Solaire</option></select></div>
      <div id="dateBox"><label>Audit Date</label><input id="date" type="date" value="2026-09-30"></div>
      <div id="monthBox" class="hidden"><label>Audit Month</label><input id="month" type="month" value="2026-09"></div>
    </div>
    <div class="actions"><button id="generate" class="btn primary">Generate Audit Image</button><button id="view" class="btn secondary">View Image</button></div>
    <button id="send" class="btn telegram disabled">Send to Telegram</button>
    <div id="status" class="status">Ready for test: Alphaland • September 30, 2026.</div>
    <div class="note">Daily → Cash Count and Cash Audit. Month-End → Monthly Report. LottoMatik remains separate.</div>
  </div>
  <div class="card" id="previewCard">
    <div class="previewHead"><h2>Audit Image</h2><span id="badge" class="badge">Not generated</span></div>
    <div id="imgWrap" class="imgWrap hidden"><img id="png" alt="Generated audit report"></div>
  </div>
</div>
<script>

function setStatus(m,e=false){status.textContent=m;status.classList.toggle('err',e)}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const row=(x,y,w,l,v,opt={})=>{const fs=opt.fs||22,b=opt.bold?'700':'400',c=opt.color||'#17211d',bg=opt.bg||'white';return `<rect x="${x}" y="${y}" width="${w}" height="44" fill="${bg}"/><line x1="${x}" x2="${x+w}" y1="${y+44}" y2="${y+44}" stroke="#dfe7e3"/><text x="${x+14}" y="${y+29}" font-family="Arial" font-size="${fs}" font-weight="${b}" fill="#17211d">${esc(l)}</text><text x="${x+w-14}" y="${y+29}" text-anchor="end" font-family="Arial" font-size="${fs}" font-weight="${opt.bold?'700':'600'}" fill="${c}">${esc(v)}</text>`};
const sec=(x,y,w,t,color,bg)=>`<rect x="${x}" y="${y}" width="${w}" height="48" rx="10" fill="${bg}"/><text x="${x+14}" y="${y+32}" font-family="Arial" font-size="24" font-weight="800" fill="${color}">${esc(t)}</text>`;
function shell(branchName,subtitle,statusText,statusBg,statusColor){const W=980,M=18;return {W,M,s:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="1430"><rect width="100%" height="100%" rx="22" fill="white"/><rect x="${M}" y="${M}" width="${W-M*2}" height="94" rx="18" fill="#F7C843"/><text x="${W/2}" y="58" text-anchor="middle" font-family="Arial" font-size="43" font-weight="800" fill="#073B3A">PSULIT ${branchName}</text><text x="${W/2}" y="89" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#073B3A">${subtitle}</text><rect x="${M}" y="120" width="${W-M*2}" height="58" rx="14" fill="${statusBg}"/><text x="${W/2}" y="157" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="${statusColor}">${statusText}</text>`}}
function buildAlphaland(){const {W,M,s:base}=shell('ALPHALAND','COMBINED DAILY AUDIT • SEPTEMBER 30, 2026','FOREX + HIVE RECONCILED • SCRATCH ₱92 OVER','#FFF4D6','#9A6500');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;s+=sec(lx,ly,C,'FOREX — PHP CASH','#fff','#2D8BD8');ly+=48;[['Opening PHP','₱175,413.98'],['+ SELL cash-in','₱122,095.70'],['− BUY cash-out','₱115,944.35'],['− Forex-funded expense','₱11,365.98']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1]);ly+=44});s+=row(lx,ly,C,'Expected closing PHP','₱170,199.35',{bold:true,bg:'#EEF6FF'});ly+=44;s+=row(lx,ly,C,'Actual closing PHP','₱170,199.35',{bold:true});ly+=44;s+=row(lx,ly,C,'PHP variance','₱0.00',{color:'#08744D',bold:true,bg:'#EAF8F1'});ly+=58;s+=sec(lx,ly,C,'SCRATCH IT','#7A4B00','#F4D35E');ly+=48;[['Opening cash','₱17,403.00'],['+ Sales','₱1,280.00'],['− Payouts','₱1,510.00']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1]);ly+=44});s+=row(lx,ly,C,'Expected closing','₱17,173.00',{bold:true,bg:'#FFF8D8'});ly+=44;s+=row(lx,ly,C,'Actual closing','₱17,265.00',{bold:true});ly+=44;s+=row(lx,ly,C,'Variance','OVER ₱92.00',{color:'#B56F00',bold:true,bg:'#FFF1D6'});ly+=44;s+=row(lx,ly,C,'SCRATCH GROSS PROFIT','₱128.00',{color:'#08744D',bold:true,bg:'#EAF8F1'});ly+=44;s+=sec(rx,ry,C,'FOREX — INVENTORY','#073B3A','#F29D49');ry+=48;[['USD','300 • matched'],['JPY','0 • matched'],['AUD','300 • matched'],['EUR','300 • matched'],['MYR','77 • matched'],['TWD','700 • matched']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{fs:21});ry+=44});ry+=14;s+=sec(rx,ry,C,'FOREX — PROFIT / INCOME','#fff','#1F9A68');ry+=48;s+=row(rx,ry,C,'USD gross profit','₱673.22',{bold:true});ry+=44;s+=row(rx,ry,C,'JPY gross profit','₱736.00',{bold:true});ry+=44;s+=row(rx,ry,C,'FOREX GROSS PROFIT','₱1,409.22',{color:'#08744D',bold:true,bg:'#EAF8F1'});ry+=44;s+=row(rx,ry,C,'Less forex expense','₱11,365.98',{fs:20});ry+=44;s+=row(rx,ry,C,'Net Forex after expense','−₱9,956.76',{color:'#B42318',bold:true,fs:20,bg:'#FFF0EF'});ry+=58;s+=sec(rx,ry,C,'HIVE','#fff','#6754C5');ry+=48;s+=row(rx,ry,C,'Opening balance','₱50,074.37',{bold:true});ry+=44;s+=row(rx,ry,C,'Expected closing','₱50,074.37',{bold:true,bg:'#EEF0FF'});ry+=44;s+=row(rx,ry,C,'Actual closing','₱50,074.37',{bold:true});ry+=44;s+=row(rx,ry,C,'Variance','₱0.00',{color:'#08744D',bold:true});ry+=44;const sy=Math.max(ly,ry)+24;s+=sec(M,sy,W-M*2,'PROFIT SUMMARY','#fff','#0C8B93');let py=sy+48;s+=row(M,py,W-M*2,'Combined gross profit','₱1,537.22',{bold:true,fs:24,bg:'#EAF8F1'});py+=44;s+=row(M,py,W-M*2,'Less Forex-funded expense','₱11,365.98',{fs:24});py+=44;s+=row(M,py,W-M*2,'NET AFTER EXPENSE','−₱9,828.76',{bold:true,fs:28,color:'#B42318',bg:'#FFF0EF'});py+=62;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="18" font-weight="700" fill="#33443d">Forex and Hive reconciled. Scratch is ₱92 OVER. LottoMatik is separate.</text></svg>`;return s.replace('height="1430"',`height="${py+28}"`)}
function buildSolaire(){const {W,M,s:base}=shell('SOLAIRE','DAILY AUDIT • SEPTEMBER 30, 2026','FOREX SHORT ₱3,909.80 • HIVE: NO SEPT 30 MOVEMENT','#FFE7E9','#A70F14');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;s+=sec(lx,ly,C,'FOREX — PHP CASH','#fff','#2D8BD8');ly+=48;[['Opening PHP (derived)','₱305,503.49'],['+ SELL cash-in','₱1,148,084.00'],['− BUY cash-out','₱859,477.10'],['− Fare expense','₱118.00'],['− Barang.ai receivable','₱12,000.00']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1],{fs:r[0].includes('Barang')?19:22});ly+=44});s+=row(lx,ly,C,'Expected closing PHP','₱581,992.39',{bold:true,bg:'#EEF6FF'});ly+=44;s+=row(lx,ly,C,'Actual closing PHP','₱578,082.59',{bold:true});ly+=44;s+=row(lx,ly,C,'PHP variance','SHORT ₱3,909.80',{color:'#B42318',bold:true,bg:'#FFF0EF'});ly+=58;s+=sec(lx,ly,C,'HIVE','#fff','#6754C5');ly+=48;s+=row(lx,ly,C,'Current cash balance','₱96,274.00',{bold:true});ly+=44;s+=row(lx,ly,C,'Sept 30 Hive in / out','₱0.00 / ₱0.00',{fs:20});ly+=44;s+=row(lx,ly,C,'Forex borrow / return','₱0.00 / ₱0.00',{fs:19});ly+=44;s+=row(lx,ly,C,'Sept 30 movement','None logged',{bold:true});ly+=44;s+=sec(rx,ry,C,'FOREX — INVENTORY','#073B3A','#F29D49');ry+=48;[['USD','9,505'],['JPY','90,000'],['EUR','100'],['TWD','4,300'],['THB','620'],['CHF','20']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{fs:21});ry+=44});ry+=14;s+=sec(rx,ry,C,'FOREX — PROFIT / INCOME','#fff','#1F9A68');ry+=48;s+=row(rx,ry,C,'USD gross profit','₱6,509.05',{bold:true});ry+=44;s+=row(rx,ry,C,'EUR gross profit','₱1,267.60',{bold:true});ry+=44;s+=row(rx,ry,C,'JPY gross profit','₱140.00',{bold:true});ry+=44;s+=row(rx,ry,C,'FOREX GROSS PROFIT','₱7,916.65',{color:'#08744D',bold:true,bg:'#EAF8F1'});ry+=44;s+=row(rx,ry,C,'Less operating expense','₱118.00',{fs:20});ry+=44;s+=row(rx,ry,C,'NET FOREX PROFIT','₱7,798.65',{color:'#08744D',bold:true,bg:'#EAF8F1'});ry+=44;const noteY=Math.max(ly,ry)+16;s+=`<rect x="${M}" y="${noteY}" width="${W-M*2}" height="52" rx="10" fill="#FFF1BD"/><text x="${M+14}" y="${noteY+33}" font-family="Arial" font-size="18" font-weight="700" fill="#8B6200">Cash movement note: Barang.ai ₱12,000 is a receivable; excluded from operating expense/profit.</text>`;const sy=noteY+64;s+=sec(M,sy,W-M*2,'PROFIT SUMMARY','#fff','#0C8B93');let py=sy+48;s+=row(M,py,W-M*2,'Forex gross profit','₱7,916.65',{bold:true,fs:24});py+=44;s+=row(M,py,W-M*2,'Operating expense','₱118.00',{fs:24});py+=44;s+=row(M,py,W-M*2,'NET FOREX PROFIT','₱7,798.65',{bold:true,fs:28,color:'#08744D',bg:'#EAF8F1'});py+=44;s+=row(M,py,W-M*2,'FOREX CASH VARIANCE','SHORT ₱3,909.80',{bold:true,fs:27,color:'#B42318',bg:'#FFF0EF'});py+=62;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="18" font-weight="700" fill="#33443d">FX quantities reconcile. Hive has no Sept 30 movement logged.</text></svg>`;return s.replace('height="1430"',`height="${py+28}"`)}
function buildMonthlyAlphaland(){const {W,M,s:base}=shell('ALPHALAND','MONTH-END REPORT • SEPTEMBER 2026','FULL SEPTEMBER FOREX ACTIVITY MERGED • MONTH-END CASH RECONCILED','#EAF8F1','#176B3A');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;s+=sec(lx,ly,C,'SEPTEMBER FOREX ACTIVITY','#fff','#2D8BD8');ly+=48;[['AR transactions','206'],['Transaction lines','264'],['BUY — PHP paid out','₱2,448,494.63'],['SELL — PHP received','₱2,686,465.75'],['TOTAL FOREX TURNOVER','₱5,134,960.38'],['Net transaction cash-in','₱237,971.12']].forEach((r,i)=>{s+=row(lx,ly,C,r[0],r[1],{bold:i>=4,bg:i===4?'#EEF6FF':'white',fs:i===4?20:22});ly+=44});ly+=14;s+=sec(lx,ly,C,'MONTH-END BALANCES','#fff','#6754C5');ly+=48;[['Forex PHP closing','₱170,199.35'],['Forex PHP variance','₱0.00'],['Scratch closing','₱17,265.00'],['Sept 30 Scratch variance','OVER ₱92.00'],['Hive closing','₱50,074.37'],['Hive variance','₱0.00']].forEach((r,i)=>{s+=row(lx,ly,C,r[0],r[1],{bold:true,color:i===1||i===5?'#08744D':i===3?'#B56F00':'#17211d',fs:i===3?20:22});ly+=44});s+=sec(rx,ry,C,'MONTH-END FX INVENTORY','#073B3A','#F29D49');ry+=48;[['USD','300'],['JPY','0'],['AUD','300'],['EUR','300'],['MYR','77'],['TWD','700']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{bold:true});ry+=44});ry+=14;s+=sec(rx,ry,C,'DATA QUALITY / AUDIT','#fff','#1F9A68');ry+=48;[['AR range','5724 – 5932'],['Legacy source','Sept 1–22'],['Live Ledger source','Sept 23–30'],['Legacy AR correction','5890 → 5880'],['Sequence exceptions','5766, 5783, 5802'],['LottoMatik','Separate audit']].forEach((r,i)=>{s+=row(rx,ry,C,r[0],r[1],{bold:true,color:i===4?'#B56F00':'#17211d',fs:i===4?19:20});ry+=44});ry+=14;s+=sec(rx,ry,C,'MONTHLY PROFIT STATUS','#7A4B00','#F4D35E');ry+=48;s+=row(rx,ry,C,'Historical cost basis','Not fully migrated',{color:'#B56F00',bold:true,fs:18});ry+=44;s+=row(rx,ry,C,'Monthly profit total','NOT FINALIZED',{color:'#B42318',bold:true,fs:19});ry+=44;const sy=Math.max(ly,ry)+24;s+=sec(M,sy,W-M*2,'MONTH-END AUDIT RESULT','#ff ath.max(ly,ry)+24;s+=sec(M,sy,W-M*2,'MONTH-END AUDIT RESULT','#fff','#0C8B93');let py=sy+48;s+=row(M,py,W-M*2,'September Forex turnover','₱46,321,775.88',{bold:true,fs:26});py+=44;s+=row(M,py,W-M*2,'Month-end Forex variance','SHORT ₱3,909.80',{bold:true,fs:26,color:'#B42318',bg:'#FFF0EF'});py+=64;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="17" font-weight="700" fill="#33443d">Source merge: legacy Sept 1–22 + Live Ledger Sept 23–30. Profit is intentionally not estimated.</text></svg>`;return s.replace('height="1430"',`height="${py+28}"`)}
async function svgToPng(svg){const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),im=new Image();return await new Promise((ok,no)=>{im.onload=()=>{const c=document.createElement('canvas');c.width=1960;c.height=Math.round(im.height*2);const ctx=c.getContext('2d');ctx.scale(2,2);ctx.drawImage(im,0,0);URL.revokeObjectURL(url);ok(c.toDataURL('image/png'))};im.onerror=e=>{URL.revokeObjectURL(url);no(e)};im.src=url})}
function resetGenerated(){imgWrap.classList.add('hidden');png.removeAttribute('src');badge.textContent='Not generated';send.classList.add('disabled');send.textContent='Send to Telegram'}
type.onchange=()=>{dateBox.classList.toggle('hidden',type.value==='monthly');monthBox.classList.toggle('hidden',type.value!=='monthly');resetGenerated();setStatus(type.value==='monthly'?'Month-End mode selected. September 2026 is connected.':'Daily mode selected.')};
branch.onchange=()=>{resetGenerated();setStatus(type.value==='monthly'?`${branch.value} September Month-End is connected.`:`${branch.value} daily audit connected.`)};
date.onchange=resetGenerated;month.onchange=resetGenerated;
$('generate').onclick=async()=>{resetGenerated();try{let svg=null;if(type.value==='daily'&&date.value==='2026-09-30')svg=branch.value==='Solaire'?buildSolaire():buildAlphaland();else if(type.value==='monthly'&&month.value==='2026-09')svg=branch.value==='Solaire'?buildMonthlySolaire():buildMonthlyAlphaland();else{setStatus('No verified data connected for this selection yet.',true);return}setStatus(`Generating ${type.value==='monthly'?'September Month-End':'daily'} ${branch.value} image…`);png.src=await svgToPng(svg);imgWrap.classList.remove('hidden');badge.textContent='PNG Ready';send.classList.remove('disabled');setStatus(`PNG Ready — ${branch.value} ${type.value==='monthly'?'September Month-End':'September 30 daily'} report generated.`)}catch(e){setStatus('Could not generate image. Please refresh and try again.',true)}};
$('view').onclick=()=>previewCard.scrollIntoView({behavior:'smooth'});
send.onclick=async()=>{if(send.classList.contains('disabled'))return;send.classList.add('disabled');send.textContent='Sending…';setStatus(`Sending ${type.value==='monthly'?'Month-End':'daily'} report to ${branch.value} Telegram…`);try{const payload={type:type.value,branch:branch.value,date:date.value,month:month.value};const r=await fetch(`${SUPA}/functions/v1/psulit-audit-app-send-test`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON}`,'apikey':ANON},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok||data.ok!==true)throw new Error(data.error||`HTTP ${r.status}`);badge.textContent='Sent';setStatus(`Sent successfully${data.threadId?' • Topic '+data.threadId:''}${data.messageId?' • Message '+data.messageId:''}.`);send.textContent='Sent to Telegram'}catch(e){setStatus('Telegram send failed: '+(e?.message||e),true);send.textContent='Send to Telegram';send.classList.remove('disabled')}};
</script>
</body>
