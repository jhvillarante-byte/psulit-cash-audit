<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSulit Audit Report</title>
<style>
:root{--g:#0c5b42;--bg:#f3f6f4;--blue:#2396eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17211d}.wrap{max-width:660px;margin:auto;padding:10px 9px 40px}.hero{background:linear-gradient(135deg,#0c503b,#08704c);color:#fff;border-radius:18px;padding:18px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;font-size:13px}.card{background:#fff;border-radius:16px;padding:14px;margin-top:11px;box-shadow:0 6px 18px rgba(26,55,44,.08)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}select,input{width:100%;border:1px solid #cad8d1;border-radius:11px;padding:12px 10px;font-size:15px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btn{border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#e9f3ee;color:var(--g)}.telegram{width:100%;margin-top:9px;background:var(--blue);color:#fff}.disabled{opacity:.45;pointer-events:none}.status{margin-top:10px;padding:10px 11px;border-radius:10px;background:#eef8f3;color:#2e624e;font-size:12px}.status.err{background:#fff0ef;color:#a5332b}.hidden{display:none}.previewHead{display:flex;justify-content:space-between;align-items:center}.previewHead h2{font-size:18px;margin:0}.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#e9f6ef;color:var(--g);font-weight:800}.imgWrap{margin-top:10px;background:#151a18;border-radius:14px;padding:6px}.imgWrap img{width:100%;display:block;border-radius:8px;background:#fff}.note{font-size:11px;color:#68766f;line-height:1.35;margin-top:8px}@media(max-width:470px){.grid,.actions{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>PSulit Audit Report</h1><p>Generate one compact audit image, review it, then send to Telegram.</p></div>
<div class="card"><div class="grid">
<div><label>Report Type</label><select id="type"><option value="daily">Daily Report</option><option value="monthly">Month-End Report</option></select></div>
<div><label>Branch</label><select id="branch"><option>Alphaland</option><option>Solaire</option></select></div>
<div id="dateBox"><label>Audit Date</label><input id="date" type="date" value="2026-09-30"></div>
<div id="monthBox" class="hidden"><label>Audit Month</label><input id="month" type="month" value="2026-09"></div>
</div>
<div class="actions"><button id="generate" class="btn primary">Generate Audit Image</button><button id="view" class="btn secondary">View Image</button></div>
<button id="send" class="btn telegram disabled">Send to Telegram</button>
<div id="status" class="status">Ready: corrected September 30 daily audits.</div>
<div class="note">Daily → Cash Count and Cash Audit. September Month-End is temporarily under review against teller sheets before reposting.</div></div>
<div class="card" id="previewCard"><div class="previewHead"><h2>Audit Image</h2><span id="badge" class="badge">Not generated</span></div><div id="imgWrap" class="imgWrap hidden"><img id="png" alt="Generated audit report"></div></div>
</div>
<script>
const SUPA='https://ivfpgshtknelingsvbfi.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2ZnBnc2h0a25lbGluZ3N2YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODU4OTYsImV4cCI6MjEwNTI2MTg5Nn0.xxzqW81NWzw7OOwQRuOoTZQIUdLGjdrcTTzmxiWK1sY';
const $=id=>document.getElementById(id),type=$('type'),branch=$('branch'),date=$('date'),month=$('month'),dateBox=$('dateBox'),monthBox=$('monthBox'),send=$('send'),status=$('status'),badge=$('badge'),png=$('png'),imgWrap=$('imgWrap'),previewCard=$('previewCard');
function setStatus(m,e=false){status.textContent=m;status.classList.toggle('err',e)}function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const row=(x,y,w,l,v,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="44" fill="${o.bg||'white'}"/><line x1="${x}" x2="${x+w}" y1="${y+44}" y2="${y+44}" stroke="#dfe7e3"/><text x="${x+14}" y="${y+29}" font-family="Arial" font-size="${o.fs||22}" font-weight="${o.bold?'700':'400'}" fill="#17211d">${esc(l)}</text><text x="${x+w-14}" y="${y+29}" text-anchor="end" font-family="Arial" font-size="${o.fs||22}" font-weight="${o.bold?'700':'600'}" fill="${o.color||'#17211d'}">${esc(v)}</text>`;
const sec=(x,y,w,t,fg,bg)=>`<rect x="${x}" y="${y}" width="${w}" height="48" rx="10" fill="${bg}"/><text x="${x+14}" y="${y+32}" font-family="Arial" font-size="24" font-weight="800" fill="${fg}">${esc(t)}</text>`;
function shell(name,sub,st,bg,fg){const W=980,M=18;return{W,M,s:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="1500"><rect width="100%" height="100%" rx="22" fill="white"/><rect x="${M}" y="${M}" width="${W-M*2}" height="94" rx="18" fill="#F7C843"/><text x="${W/2}" y="58" text-anchor="middle" font-family="Arial" font-size="43" font-weight="800" fill="#073B3A">PSULIT ${name}</text><text x="${W/2}" y="89" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#073B3A">${sub}</text><rect x="${M}" y="120" width="${W-M*2}" height="58" rx="14" fill="${bg}"/><text x="${W/2}" y="157" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="${fg}">${st}</text>`}}
function buildSolaire(){const {W,M,s:base}=shell('SOLAIRE','DAILY AUDIT • SEPTEMBER 30, 2026','FOREX CASH RECONCILED • NO SHORTAGE','#EAF8F1','#176B3A');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;
s+=sec(lx,ly,C,'FOREX — PHP CASH','#fff','#2D8BD8');ly+=48;
[['Opening PHP','₱705,668.38'],['+ Day shift SELL cash-in','₱1,148,084.00'],['− Day shift BUY cash-out','₱766,117.10'],['− Barang.ai receivable','₱12,000.00'],['− Fare expense','₱118.00']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1],{fs:r[0].includes('Barang')?19:20});ly+=44});
s+=row(lx,ly,C,'Day shift ending','₱1,075,517.28',{bold:true,bg:'#EEF6FF'});ly+=44;s+=row(lx,ly,C,'− Night shift BUY cash-out','₱654,266.20',{fs:19});ly+=44;s+=row(lx,ly,C,'Expected final closing','₱421,251.08',{bold:true});ly+=44;s+=row(lx,ly,C,'Actual final closing','₱421,251.08',{bold:true});ly+=44;s+=row(lx,ly,C,'PHP variance','₱0.00',{bold:true,color:'#08744D',bg:'#EAF8F1'});ly+=58;
s+=sec(lx,ly,C,'HIVE','#fff','#6754C5');ly+=48;s+=row(lx,ly,C,'Current cash balance','₱96,274.00',{bold:true});ly+=44;s+=row(lx,ly,C,'Sept 30 Hive in / out','₱0.00 / ₱0.00',{fs:20});ly+=44;s+=row(lx,ly,C,'Forex borrow / return','₱0.00 / ₱0.00',{fs:19});ly+=44;s+=row(lx,ly,C,'Sept 30 movement','None logged',{bold:true});ly+=44;
s+=sec(rx,ry,C,'FOREX — INVENTORY','#073B3A','#F29D49');ry+=48;[['USD','13,390'],['SGD','10'],['HKD','20'],['CAD','1,020'],['AUD','100'],['GBP','5'],['KRW','640,000'],['THB','4,940'],['TWD','1,000']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{fs:20,bold:true});ry+=44});ry+=14;
s+=sec(rx,ry,C,'FOREX — PROFIT / INCOME','#fff','#1F9A68');ry+=48;s+=row(rx,ry,C,'USD gross profit','₱6,891.00',{bold:true});ry+=44;s+=row(rx,ry,C,'EUR gross profit','₱1,272.60',{bold:true});ry+=44;s+=row(rx,ry,C,'JPY gross profit','₱197.00',{bold:true});ry+=44;s+=row(rx,ry,C,'FOREX GROSS PROFIT','₱8,360.60',{bold:true,color:'#08744D',bg:'#EAF8F1'});ry+=44;s+=row(rx,ry,C,'Less operating expense','₱118.00',{fs:20});ry+=44;s+=row(rx,ry,C,'NET FOREX PROFIT','₱8,242.60',{bold:true,color:'#08744D',bg:'#EAF8F1'});ry+=44;
const n=Math.max(ly,ry)+16;s+=`<rect x="${M}" y="${n}" width="${W-M*2}" height="52" rx="10" fill="#FFF1BD"/><text x="${M+14}" y="${n+33}" font-family="Arial" font-size="18" font-weight="700" fill="#8B6200">AR coverage 2073–2096 • Barang.ai ₱12,000 is a receivable; excluded from profit.</text>`;const sy=n+64;s+=sec(M,sy,W-M*2,'PROFIT SUMMARY','#fff','#0C8B93');let py=sy+48;s+=row(M,py,W-M*2,'Forex gross profit','₱8,360.60',{bold:true,fs:24});py+=44;s+=row(M,py,W-M*2,'Operating expense','₱118.00',{fs:24});py+=44;s+=row(M,py,W-M*2,'NET FOREX PROFIT','₱8,242.60',{bold:true,fs:28,color:'#08744D',bg:'#EAF8F1'});py+=44;s+=row(M,py,W-M*2,'FOREX CASH VARIANCE','₱0.00 • RECONCILED',{bold:true,fs:25,color:'#08744D',bg:'#EAF8F1'});py+=62;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="18" font-weight="700" fill="#33443d">Source: Solaire teller reporting sheet • full Sept 30 operational shift.</text></svg>`;return s.replace('height="1500"',`height="${py+28}"`)}
function buildAlphaland(){const {W,M,s:base}=shell('ALPHALAND','COMBINED DAILY AUDIT • SEPTEMBER 30, 2026','FOREX + HIVE RECONCILED • SCRATCH ₱92 OVER','#FFF4D6','#9A6500');let s=base;const G=16,C=(W-M*2-G)/2,lx=M,rx=M+C+G;let ly=194,ry=194;s+=sec(lx,ly,C,'FOREX — PHP CASH','#fff','#2D8BD8');ly+=48;[['Opening PHP','₱175,413.98'],['+ SELL cash-in','₱122,095.70'],['− BUY cash-out','₱115,944.35'],['− Forex-funded expense','₱11,365.98']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1]);ly+=44});s+=row(lx,ly,C,'Expected closing PHP','₱170,199.35',{bold:true,bg:'#EEF6FF'});ly+=44;s+=row(lx,ly,C,'Actual closing PHP','₱170,199.35',{bold:true});ly+=44;s+=row(lx,ly,C,'PHP variance','₱0.00',{color:'#08744D',bold:true,bg:'#EAF8F1'});ly+=58;s+=sec(lx,ly,C,'SCRATCH IT','#7A4B00','#F4D35E');ly+=48;[['Opening cash','₱17,403.00'],['+ Sales','₱1,280.00'],['− Payouts','₱1,510.00']].forEach(r=>{s+=row(lx,ly,C,r[0],r[1]);ly+=44});s+=row(lx,ly,C,'Expected closing','₱17,173.00',{bold:true,bg:'#FFF8D8'});ly+=44;s+=row(lx,ly,C,'Actual closing','₱17,265.00',{bold:true});ly+=44;s+=row(lx,ly,C,'Variance','OVER ₱92.00',{color:'#B56F00',bold:true,bg:'#FFF1D6'});ly+=44;s+=row(lx,ly,C,'SCRATCH GROSS PROFIT','₱128.00',{color:'#08744D',bold:true,bg:'#EAF8F1'});ly+=44;s+=sec(rx,ry,C,'FOREX — INVENTORY','#073B3A','#F29D49');ry+=48;[['USD','300'],['JPY','0'],['AUD','300'],['EUR','300'],['MYR','77'],['TWD','700']].forEach(r=>{s+=row(rx,ry,C,r[0],r[1],{bold:true});ry+=44});ry+=14;s+=sec(rx,ry,C,'FOREX — PROFIT / INCOME','#fff','#1F9A68');ry+=48;s+=row(rx,ry,C,'Forex gross profit','₱1,409.22',{bold:true,color:'#08744D',bg:'#EAF8F1'});ry+=44;s+=row(rx,ry,C,'Less forex expense','₱11,365.98');ry+=44;s+=row(rx,ry,C,'Net Forex after expense','−₱9,956.76',{bold:true,color:'#B42318',bg:'#FFF0EF'});ry+=58;s+=sec(rx,ry,C,'HIVE','#fff','#6754C5');ry+=48;s+=row(rx,ry,C,'Actual closing','₱50,074.37',{bold:true});ry+=44;s+=row(rx,ry,C,'Variance','₱0.00',{bold:true,color:'#08744D'});const sy=Math.max(ly,ry)+24;s+=sec(M,sy,W-M*2,'PROFIT SUMMARY','#fff','#0C8B93');let py=sy+48;s+=row(M,py,W-M*2,'Combined gross profit','₱1,537.22',{bold:true,fs:24});py+=44;s+=row(M,py,W-M*2,'Less Forex-funded expense','₱11,365.98',{fs:24});py+=44;s+=row(M,py,W-M*2,'NET AFTER EXPENSE','−₱9,828.76',{bold:true,fs:28,color:'#B42318',bg:'#FFF0EF'});py+=62;s+=`<text x="${M+8}" y="${py}" font-family="Arial" font-size="18" font-weight="700" fill="#33443d">Forex and Hive reconciled. Scratch is ₱92 OVER. LottoMatik is separate.</text></svg>`;return s.replace('height="1500"',`height="${py+28}"`)}
async function svgToPng(svg){const b=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),u=URL.createObjectURL(b),im=new Image();return await new Promise((ok,no)=>{im.onload=()=>{const c=document.createElement('canvas');c.width=1960;c.height=Math.round(im.height*2);const x=c.getContext('2d');x.scale(2,2);x.drawImage(im,0,0);URL.revokeObjectURL(u);ok(c.toDataURL('image/png'))};im.onerror=e=>{URL.revokeObjectURL(u);no(e)};im.src=u})}
function reset(){imgWrap.classList.add('hidden');png.removeAttribute('src');badge.textContent='Not generated';send.classList.add('disabled');send.textContent='Send to Telegram'}
type.onchange=()=>{dateBox.classList.toggle('hidden',type.value==='monthly');monthBox.classList.toggle('hidden',type.value!=='monthly');reset();setStatus(type.value==='monthly'?'September Month-End is under review against teller sheets.':'Daily mode selected.')};branch.onchange=reset;date.onchange=reset;month.onchange=reset;
$('generate').onclick=async()=>{reset();if(type.value==='monthly'){setStatus('Month-End report is temporarily under review. Please use Daily Report for now.',true);return}if(date.value!=='2026-09-30'){setStatus('Only September 30, 2026 is connected in this build.',true);return}try{const svg=branch.value==='Solaire'?buildSolaire():buildAlphaland();setStatus(`Generating corrected ${branch.value} report…`);png.src=await svgToPng(svg);imgWrap.classList.remove('hidden');badge.textContent='PNG Ready';send.classList.remove('disabled');setStatus(`PNG Ready — ${branch.value} September 30 report.`)}catch(e){setStatus('Could not generate image. Please refresh and try again.',true)}};
$('view').onclick=()=>previewCard.scrollIntoView({behavior:'smooth'});
send.onclick=async()=>{if(send.classList.contains('disabled'))return;send.classList.add('disabled');send.textContent='Sending…';try{const r=await fetch(`${SUPA}/functions/v1/psulit-audit-app-send-test`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON}`,'apikey':ANON},body:JSON.stringify({type:'daily',branch:branch.value,date:date.value})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)throw new Error(d.error||`HTTP ${r.status}`);badge.textContent='Sent';setStatus(`Sent successfully${d.threadId?' • Topic '+d.threadId:''}${d.messageId?' • Message '+d.messageId:''}.`);send.textContent='Sent to Telegram'}catch(e){setStatus('Telegram send failed: '+(e?.message||e),true);send.textContent='Send to Telegram';send.classList.remove('disabled')}};
</script></body></html>
