<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PSulit Audit Report</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>
:root{--g:#0c5b42;--bg:#f3f6f4;--line:#dbe5e0;--gold:#a76e00;--red:#d92d20;--blue:#2396eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17211d}.wrap{max-width:660px;margin:auto;padding:10px 9px 40px}.hero{background:linear-gradient(135deg,#0c503b,#08704c);color:#fff;border-radius:18px;padding:18px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;font-size:13px;opacity:.9}.card{background:#fff;border-radius:16px;padding:14px;margin-top:11px;box-shadow:0 6px 18px rgba(26,55,44,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}select,input{width:100%;border:1px solid #cad8d1;border-radius:11px;padding:12px 10px;font-size:15px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btn{border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:850}.primary{background:var(--g);color:#fff}.secondary{background:#e9f3ee;color:var(--g)}.telegram{width:100%;margin-top:9px;background:var(--blue);color:#fff}.disabled{opacity:.45;pointer-events:none}.status{margin-top:10px;padding:10px 11px;border-radius:10px;background:#eef8f3;color:#2e624e;font-size:12px}.hidden{display:none}.image-shell{margin-top:10px;background:#151a18;border-radius:14px;padding:8px;overflow:auto}.report{width:100%;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.rhead{background:var(--g);color:#fff;padding:13px}.rhead .title{font-size:23px;font-weight:900}.rhead .sub{font-size:12px;margin-top:2px}.banner{padding:8px 11px;background:#e8f6ef;color:var(--g);font-size:13px;font-weight:900}.sec{border-top:1px solid var(--line)}.sec-title{padding:8px 11px;background:#f0f5f2;color:var(--g);font-size:14px;font-weight:900}.sec-title.gold{background:#fff4d5;color:#8b6200}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 11px;border-top:1px solid #edf1ef;font-size:12.5px}.v{text-align:right;font-weight:650}.good{color:#148942}.warn{color:#b87a00}.bad{color:var(--red)}.total{background:#f0faf4}.foot{padding:10px 11px;background:#f6faf8;font-size:10.5px;line-height:1.35}.pngWrap{margin-top:10px}.pngWrap img{width:100%;border-radius:10px;display:block;background:#fff}.previewHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.previewHead h2{font-size:18px;margin:0}.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#e9f6ef;color:var(--g);font-weight:800}.note{font-size:11px;color:#68766f;line-height:1.35;margin-top:8px}@media(max-width:470px){.grid,.grid3,.actions{grid-template-columns:1fr}.hero h1{font-size:25px}.rhead .title{font-size:21px}.row{font-size:12px}}
</style></head><body><div class="wrap"><div class="hero"><h1>PSulit Audit Report</h1><p>Generate a narrow mobile audit image, review it, then send to Telegram.</p></div><div class="card"><div class="grid3"><div><label>Report Type</label><select id="type"><option value="daily">Daily Report</option><option value="monthly">Month-End Report</option></select></div><div><label>Branch</label><select id="branch"><option>Alphaland</option><option>Solaire</option></select></div><div id="dateBox"><label>Audit Date</label><input id="date" type="date" value="2026-09-30"></div><div id="monthBox" class="hidden"><label>Audit Month</label><input id="month" type="month" value="2026-09"></div></div><div class="actions"><button id="generate" class="btn primary">Generate Audit Image</button><button id="view" class="btn secondary">View Image</button></div><button id="send" class="btn telegram disabled">Send to Telegram</button><div id="status" class="status">Ready for test: Alphaland • September 30, 2026.</div><div class="note">Alphaland includes Forex, Scratch, Hive and LottoMatik. Solaire includes Forex and Hive only. Month-End uses the same branch rules.</div></div><div class="card" id="previewCard"><div class="previewHead"><h2>Audit Image</h2><span id="badge" class="badge">Preview</span></div><div class="image-shell"><div id="report" class="report"></div></div><div id="pngWrap" class="pngWrap hidden"><img id="png"></div></div></div><script>
const alphaland={branch:'Alphaland',date:'2026-09-30',status:'FOREX + HIVE RECONCILED • SCRATCH ₱92 OVER',sections:[['FOREX — PHP CASH RECONCILIATION',0,[['Opening PHP','₱175,413.98'],['+ SELL cash-in','₱122,095.70'],['− BUY cash-out','₱115,944.35'],['− Forex-funded expense','₱11,365.98'],['Expected closing PHP','₱170,199.35','b'],['Actual closing PHP','₱170,199.35','b'],['PHP variance','₱0.00','good'],['Expense detail','Bridge Access Payment ₱11,365.98']]],['FOREX — INVENTORY CHECK',0,[['USD','129 + 1,865 − 1,694 = 300'],['JPY','40,000 − 40,000 = 0'],['AUD / EUR / MYR / TWD','300 / 300 / 77 / 700 • matched']]],['FOREX — PROFIT / INCOME',0,[['USD gross profit','₱673.22','b'],['JPY gross profit','₱736.00','b'],['FOREX GROSS PROFIT','₱1,409.22','good total'],['Net Forex after expense','−₱9,956.76','bad']]],['SCRATCH IT',1,[['Opening cash','₱17,403.00'],['+ Sales','₱1,280.00'],['− Payouts','₱1,510.00'],['Expected closing','₱17,173.00','b'],['Actual closing','₱17,265.00','b'],['Scratch variance','OVER ₱92.00','warn'],['Cards sold','64'],['Supplier cost','₱1,152.00'],['SCRATCH GROSS PROFIT','₱128.00','good total']]],['HIVE',0,[['Opening balance','₱50,074.37'],['Hive in / out','₱0.00 / ₱0.00'],['Forex borrow / return','₱0.00 / ₱0.00'],['Expected / actual closing','₱50,074.37','b'],['Hive variance','₱0.00','good']]],['LOTTOMATIK',0,[['Cash movement','No Top-Up / Winning Ticket Payout logged'],['Effect on Forex','None — separate drawer']]],['PROFIT SUMMARY',0,[['Forex gross profit','₱1,409.22'],['Scratch gross profit','₱128.00'],['Combined gross profit','₱1,537.22','b'],['Less Forex-funded expense','₱11,365.98'],['NET AFTER EXPENSE','−₱9,828.76','bad total']]]],foot:'No missing Forex PHP or foreign currency. Hive reconciled. Scratch is ₱92 OVER, not short.'};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pd(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}function render(d,label='COMBINED DAILY AUDIT'){let h=`<div class="rhead"><div class="title">PSULIT ${esc(d.branch.toUpperCase())}</div><div class="sub">${label} • ${pd(d.date)}</div></div><div class="banner">✓ STATUS: ${esc(d.status)}</div>`;d.sections.forEach(([t,g,rows])=>{h+=`<div class="sec"><div class="sec-title ${g?'gold':''}">${esc(t)}</div>`;rows.forEach(r=>{let c=r[2]||'';h+=`<div class="row ${c.includes('total')?'total':''}"><div>${c==='b'||c.includes('total')?'<strong>'+esc(r[0])+'</strong>':esc(r[0])}</div><div class="v ${c.includes('good')?'good':''} ${c.includes('warn')?'warn':''} ${c.includes('bad')?'bad':''}">${c==='b'||c.includes('total')?'<strong>'+esc(r[1])+'</strong>':esc(r[1])}</div></div>`});h+='</div>'});h+=`<div class="foot"><strong>Audit result:</strong> ${esc(d.foot)}</div>`;report.innerHTML=h}
async function makePng(){status.textContent='Generating image…';await new Promise(r=>setTimeout(r,80));const c=await html2canvas(report,{backgroundColor:'#ffffff',scale:2,useCORS:true});png.src=c.toDataURL('image/png');pngWrap.classList.remove('hidden');badge.textContent='PNG Ready';status.textContent='Audit image generated successfully.';send.classList.remove('disabled');return c}
render(alphaland);type.onchange=()=>{dateBox.classList.toggle('hidden',type.value==='monthly');monthBox.classList.toggle('hidden',type.value!=='monthly');status.textContent=type.value==='monthly'?'Month-End mode selected.':'Daily mode selected.'};branch.onchange=()=>{status.textContent=branch.value==='Solaire'?'Solaire rule: Forex + Hive only.':'Alphaland rule: Forex + Scratch + Hive + LottoMatik.'};generate.onclick=async()=>{if(type.value==='daily'&&branch.value==='Alphaland'&&date.value==='2026-09-30'){render(alphaland);await makePng()}else if(type.value==='monthly'){status.textContent='Month-End layout is ready; live full-month aggregation is the next data connection. No figures will be invented.';send.classList.add('disabled')}else if(branch.value==='Solaire'){status.textContent='Solaire will generate Forex + Hive only. Live data connection for this date is not yet completed.';send.classList.add('disabled')}else{status.textContent='Live data for this date is not yet connected. No figures will be invented.';send.classList.add('disabled')}};view.onclick=()=>previewCard.scrollIntoView({behavior:'smooth'});send.onclick=()=>{status.textContent='Image is ready. Telegram sending will be connected after the live data endpoint so the app sends only verified reports.'};
</script></body></html>
