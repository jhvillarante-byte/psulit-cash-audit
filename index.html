<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PSulit Audit Report</title><style>
:root{--g:#0c5b42;--bg:#f3f6f4;--line:#dbe5e0;--blue:#2396eb;--red:#d92d20}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17211d}.wrap{max-width:660px;margin:auto;padding:10px 9px 40px}.hero{background:linear-gradient(135deg,#0c503b,#08704c);color:#fff;border-radius:18px;padding:18px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;font-size:13px;opacity:.9}.card{background:#fff;border-radius:16px;padding:14px;margin-top:11px;box-shadow:0 6px 18px rgba(26,55,44,.08)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}select,input{width:100%;border:1px solid #cad8d1;border-radius:11px;padding:12px 10px;font-size:15px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btn{border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#e9f3ee;color:var(--g)}.telegram{width:100%;margin-top:9px;background:var(--blue);color:#fff}.disabled{opacity:.45;pointer-events:none}.status{margin-top:10px;padding:10px 11px;border-radius:10px;background:#eef8f3;color:#2e624e;font-size:12px}.status.err{background:#fff0ef;color:#a5332b}.hidden{display:none}.previewHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.previewHead h2{font-size:18px;margin:0}.badge{font-size:11px;padding:6px 8px;border-radius:999px;background:#e9f6ef;color:var(--g);font-weight:800}.imgWrap{margin-top:10px;background:#151a18;border-radius:14px;padding:8px}.imgWrap img{width:100%;display:block;border-radius:9px;background:#fff}.note{font-size:11px;color:#68766f;line-height:1.35;margin-top:8px}@media(max-width:470px){.grid,.actions{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body><div class="wrap"><div class="hero"><h1>PSulit Audit Report</h1><p>Generate one audit image, review it, then send to Telegram.</p></div><div class="card"><div class="grid"><div><label>Report Type</label><select id="type"><option value="daily">Daily Report</option><option value="monthly">Month-End Report</option></select></div><div><label>Branch</label><select id="branch"><option>Alphaland</option><option>Solaire</option></select></div><div id="dateBox"><label>Audit Date</label><input id="date" type="date" value="2026-09-30"></div><div id="monthBox" class="hidden"><label>Audit Month</label><input id="month" type="month" value="2026-09"></div></div><div class="actions"><button id="generate" class="btn primary">Generate Audit Image</button><button id="view" class="btn secondary">View Image</button></div><button id="send" class="btn telegram disabled">Send to Telegram</button><div id="status" class="status">Ready for test: Alphaland • September 30, 2026.</div><div class="note">Alphaland: Forex + Scratch + Hive + LottoMatik. Solaire: Forex + Hive only. Month-End follows the same branch rules.</div></div><div class="card" id="previewCard"><div class="previewHead"><h2>Audit Image</h2><span id="badge" class="badge">Not generated</span></div><div id="imgWrap" class="imgWrap hidden"><img id="png" alt="Generated audit report"></div></div></div><script>
const SUPA='https://ivfpgshtknelingsvbfi.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2ZnBnc2h0a25lbGluZ3N2YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODU4OTYsImV4cCI6MjEwNTI2MTg5Nn0.xxzqW81NWzw7OOwQRuOoTZQIUdLGjdrcTTzmxiWK1sY';
const $=id=>document.getElementById(id),type=$('type'),branch=$('branch'),date=$('date'),month=$('month'),dateBox=$('dateBox'),monthBox=$('monthBox'),generate=$('generate'),view=$('view'),send=$('send'),status=$('status'),badge=$('badge'),png=$('png'),imgWrap=$('imgWrap'),previewCard=$('previewCard');
function setStatus(msg,err=false){status.textContent=msg;status.classList.toggle('err',err)}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildSvg(){const rows=[
['section','FOREX — PHP CASH RECONCILIATION',''],['row','Opening PHP','₱175,413.98'],['row','+ SELL cash-in','₱122,095.70'],['row','− BUY cash-out','₱115,944.35'],['row','− Forex-funded expense','₱11,365.98'],['bold','Expected closing PHP','₱170,199.35'],['bold','Actual closing PHP','₱170,199.35'],['good','PHP variance','₱0.00'],['row','Expense detail','Bridge Access Payment ₱11,365.98'],
['section','FOREX — INVENTORY CHECK',''],['row','USD','129 + 1,865 − 1,694 = 300'],['row','JPY','40,000 − 40,000 = 0'],['row','AUD / EUR / MYR / TWD','300 / 300 / 77 / 700 • matched'],
['section','FOREX — PROFIT / INCOME',''],['bold','USD gross profit','₱673.22'],['bold','JPY gross profit','₱736.00'],['goodbold','FOREX GROSS PROFIT','₱1,409.22'],['bad','Net Forex after expense','−₱9,956.76'],
['gold','SCRATCH IT',''],['row','Opening cash','₱17,403.00'],['row','+ Sales','₱1,280.00'],['row','− Payouts','₱1,510.00'],['bold','Expected closing','₱17,173.00'],['bold','Actual closing','₱17,265.00'],['warn','Scratch variance','OVER ₱92.00'],['row','Cards sold','64'],['row','Supplier cost','₱1,152.00'],['goodbold','SCRATCH GROSS PROFIT','₱128.00'],
['section','HIVE',''],['row','Opening balance','₱50,074.37'],['row','Hive in / out','₱0.00 / ₱0.00'],['row','Forex borrow / return','₱0.00 / ₱0.00'],['bold','Expected / actual closing','₱50,074.37'],['good','Hive variance','₱0.00'],
['section','LOTTOMATIK',''],['row','Cash movement','No Top-Up / Winning Ticket Payout logged'],['row','Effect on Forex','None — separate drawer'],
['section','PROFIT SUMMARY',''],['bold','Forex gross profit','₱1,409.22'],['bold','Scratch gross profit','₱128.00'],['goodbold','Combined gross profit','₱1,537.22'],['row','Less Forex-funded expense','₱11,365.98'],['badbold','NET AFTER EXPENSE','−₱9,828.76']];
const W=760,rowH=42,head=128,foot=70,H=head+rows.length*rowH+foot;let y=head;let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><rect width="100%" height="100%" fill="white"/><rect width="100%" height="86" fill="#0c5b42"/><text x="22" y="39" font-family="Arial" font-size="30" font-weight="700" fill="white">PSULIT ALPHALAND</text><text x="22" y="67" font-family="Arial" font-size="16" fill="white">COMBINED DAILY AUDIT • September 30, 2026</text><rect y="86" width="100%" height="42" fill="#e9f6ef"/><text x="22" y="112" font-family="Arial" font-size="15" font-weight="700" fill="#0c5b42">STATUS: FOREX + HIVE RECONCILED • SCRATCH ₱92 OVER</text>`;
for(const [kind,l,v] of rows){if(kind==='section'||kind==='gold'){s+=`<rect y="${y}" width="100%" height="${rowH}" fill="${kind==='gold'?'#fff4d5':'#f0f5f2'}"/><text x="22" y="${y+27}" font-family="Arial" font-size="17" font-weight="700" fill="${kind==='gold'?'#8b6200':'#0c5b42'}">${esc(l)}</text>`}else{const bold=kind.includes('bold');const color=kind.startsWith('good')?'#148942':kind.startsWith('warn')?'#b87a00':kind.startsWith('bad')?'#d92d20':'#17211d';s+=`<line x1="22" x2="738" y1="${y}" y2="${y}" stroke="#e7eeea"/><text x="22" y="${y+27}" font-family="Arial" font-size="15" font-weight="${bold?'700':'400'}" fill="#17211d">${esc(l)}</text><text x="738" y="${y+27}" text-anchor="end" font-family="Arial" font-size="15" font-weight="${bold?'700':'600'}" fill="${color}">${esc(v)}</text>`}y+=rowH}
s+=`<rect y="${y}" width="100%" height="${foot}" fill="#f6faf8"/><text x="22" y="${y+26}" font-family="Arial" font-size="13" font-weight="700" fill="#17211d">Audit result: No missing Forex PHP or foreign currency.</text><text x="22" y="${y+48}" font-family="Arial" font-size="13" fill="#46524d">Hive reconciled. Scratch is ₱92 OVER, not short.</text></svg>`;return s}
async function svgToPng(svg){const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),im=new Image();return await new Promise((ok,no)=>{im.onload=()=>{const c=document.createElement('canvas');c.width=1520;c.height=Math.round(im.height*2);const ctx=c.getContext('2d');ctx.scale(2,2);ctx.drawImage(im,0,0);URL.revokeObjectURL(url);ok(c.toDataURL('image/png'))};im.onerror=e=>{URL.revokeObjectURL(url);no(e)};im.src=url})}
function resetGenerated(){imgWrap.classList.add('hidden');png.removeAttribute('src');badge.textContent='Not generated';send.classList.add('disabled')}
type.onchange=()=>{dateBox.classList.toggle('hidden',type.value==='monthly');monthBox.classList.toggle('hidden',type.value!=='monthly');resetGenerated();setStatus(type.value==='monthly'?'Month-End mode selected.':'Daily mode selected.')};
branch.onchange=()=>{resetGenerated();setStatus(branch.value==='Solaire'?'Solaire rule: Forex + Hive only.':'Alphaland rule: Forex + Scratch + Hive + LottoMatik.')};
date.onchange=resetGenerated;month.onchange=resetGenerated;
generate.onclick=async()=>{resetGenerated();if(type.value==='daily'&&branch.value==='Alphaland'&&date.value==='2026-09-30'){try{setStatus('Generating verified audit image…');png.src=await svgToPng(buildSvg());imgWrap.classList.remove('hidden');badge.textContent='PNG Ready';send.classList.remove('disabled');setStatus('PNG Ready — one September 30 Alphaland audit image generated.')}catch(e){setStatus('Could not generate image. Please refresh and try again.',true)}}else if(type.value==='monthly'){setStatus('Month-End layout is ready; live monthly aggregation is not connected yet.',true)}else if(branch.value==='Solaire'){setStatus('Solaire will use Forex + Hive only. Live data for this date is not connected yet.',true)}else{setStatus('No verified data connected for this selection yet.',true)}};
view.onclick=()=>previewCard.scrollIntoView({behavior:'smooth'});
send.onclick=async()=>{if(send.classList.contains('disabled'))return;send.classList.add('disabled');send.textContent='Sending…';setStatus('Sending verified audit image to Alphaland Telegram…');try{const r=await fetch(`${SUPA}/functions/v1/psulit-audit-app-send-test`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON}`,'apikey':ANON},body:JSON.stringify({type:type.value,branch:branch.value,date:date.value})});const data=await r.json().catch(()=>({}));if(!r.ok||data.ok!==true)throw new Error(data.error||`HTTP ${r.status}`);badge.textContent='Sent';setStatus(`Sent to Telegram successfully${data.messageId?' • Message '+data.messageId:''}.`);send.textContent='Sent to Telegram';}catch(e){setStatus('Telegram send failed: '+(e?.message||e),true);send.textContent='Send to Telegram';send.classList.remove('disabled')}};
</script></body></html>
